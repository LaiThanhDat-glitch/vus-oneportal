[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vus-oneportal-api"
version = "0.1.0"
description = "FastAPI backend for the VUS OnePortal MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115,<1.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "asyncpg>=0.29,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "redis>=5.2,<7.0",
  "PyJWT>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "cryptography>=44,<47",
  "httpx>=0.28,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP"]

[tool.setuptools.packages.find]
include = ["app*"]
